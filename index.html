<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GPA Calculator</title>
  <meta name="description" content="A minimal, offline-capable weighted GPA calculator for On Level, Honors, AP and IB courses." />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GPA" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0b;
      --surface: #141414;
      --surface-2: #1c1c1c;
      --line: #2a2a2a;
      --text: #f3f3f3;
      --muted: #8a8a8a;
      --faint: #5c5c5c;
      --invert: #f3f3f3;
      --invert-text: #0b0b0b;
      --radius: 18px;
      --radius-sm: 14px;
      --radius-xs: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: "Outfit", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow: hidden;
    }

    button, input { font-family: inherit; }

    button {
      appearance: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #f3f3f3;
      outline-offset: 2px;
    }

    .squircle { border-radius: var(--radius); }
    .squircle-sm { border-radius: var(--radius-sm); }
    .squircle-xs { border-radius: var(--radius-xs); }

    [hidden] { display: none !important; }

    #app { min-height: 100dvh; }

    .app-shell {
      width: 100%;
      max-width: 1600px;
      height: 100dvh;
      margin-inline: auto;
      padding-top: env(safe-area-inset-top);
      padding-inline: clamp(1rem, 2.6vw, 2.5rem);
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .app-header { flex-shrink: 0; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(20rem, 25rem) minmax(0, 1fr);
      gap: clamp(1rem, 1.8vw, 1.5rem);
      flex: 1;
      min-height: 0;
      margin-top: clamp(1.25rem, 2.6vw, 2.25rem);
    }

    .stats-panel {
      background: #121212;
      border: 1px solid var(--line);
      padding: clamp(1.4rem, 2.4vw, 2.35rem);
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
    }

    .stats-panel::-webkit-scrollbar { display: none; }

    .stat-block {
      border-bottom: 1px solid var(--line);
      padding: clamp(1rem, 2.3vh, 1.65rem) 0 clamp(1.15rem, 2.6vh, 1.8rem);
    }

    .stat-block:first-child { padding-top: 0.35rem; }

    .stat-number {
      font-weight: 300;
      font-size: clamp(3.7rem, 5.4vw, 5.5rem);
      letter-spacing: -0.065em;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      margin-top: 0.45rem;
      white-space: nowrap;
    }

    .stat-number--small { font-size: clamp(3.1rem, 4.2vw, 4.35rem); }

    .stats-footer {
      margin-top: auto;
      padding-top: 1.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
    }

    .scale-note {
      color: var(--faint);
      font-size: 0.78rem;
      line-height: 1.6;
    }

    .course-scroll {
      background: #101010;
      border: 1px solid var(--line);
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: #484848 transparent;
    }

    .course-scroll:focus-visible {
      outline: 2px solid #f3f3f3;
      outline-offset: 2px;
    }

    .course-scroll::-webkit-scrollbar { width: 10px; }

    .course-scroll::-webkit-scrollbar-track { background: transparent; }

    .course-scroll::-webkit-scrollbar-thumb {
      background: #484848;
      border: 2px solid #101010;
      border-radius: 999px;
    }

    .course-scroll-inner {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: clamp(1rem, 2vw, 1.5rem);
    }

    .course-list { min-width: 0; }

    .course-controls {
      display: grid;
      grid-template-columns: 7rem minmax(0, 1.4fr) minmax(13rem, 0.9fr);
      gap: 1rem;
      align-items: start;
      margin-top: 1.1rem;
    }

    .control-group { min-width: 0; }

    .grade-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.45rem;
    }

    .mode-switch { display: flex; gap: 0.4rem; }

    .grade-input { margin-top: 0.8rem; }

    .letter-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 0.45rem;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .score-row .field { max-width: 13rem; }

    .field {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.9rem;
      width: 100%;
      font-size: 0.95rem;
    }

    .field::placeholder { color: var(--faint); }

    .field:focus {
      outline: none;
      border-color: #555;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] { -moz-appearance: textfield; }

    .seg {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .seg:hover { background: var(--surface-2); color: var(--text); }

    .seg.is-on {
      background: var(--invert);
      border-color: var(--invert);
      color: var(--invert-text);
    }

    .letter {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      min-height: 2.55rem;
      font-size: 0.82rem;
      font-weight: 500;
    }

    .letter:hover { background: var(--surface-2); color: var(--text); }

    .letter.is-on {
      background: var(--invert);
      border-color: var(--invert);
      color: var(--invert-text);
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      width: 2.6rem;
      height: 2.6rem;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .icon-btn:hover { color: var(--text); background: var(--surface-2); }

    .add-btn {
      background: transparent;
      border: 1px dashed #3d3d3d;
      color: var(--muted);
      width: 100%;
      min-height: 4.4rem;
      padding: 0.95rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      flex-shrink: 0;
    }

    .add-btn:hover {
      background: var(--surface);
      border-color: #5c5c5c;
      color: var(--text);
    }

    .ghost {
      background: transparent;
      border: 0;
      color: var(--faint);
      font-size: 0.8rem;
    }

    .ghost:hover { color: var(--text); }

    .save-btn {
      background: var(--invert);
      border: 1px solid var(--invert);
      color: var(--invert-text);
      padding: 0.62rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .save-btn:hover { background: #ffffff; border-color: #ffffff; }

    .save-btn.is-saved { background: var(--surface-2); color: var(--text); border-color: var(--line); }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--faint);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.is-live { background: #7ad39b; }

    .course {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 1.1rem;
    }

    .label {
      color: var(--faint);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .stat-val {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    @media (max-width: 1180px) {
      .course-controls { grid-template-columns: 7rem minmax(0, 1fr); }

      .course-grade-control { grid-column: 1 / -1; }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }

      .app-shell {
        height: auto;
        min-height: 100dvh;
      }

      .workspace { grid-template-columns: 1fr; }

      .stats-panel { overflow: visible; }

      .stats-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 1.5rem;
      }

      .stat-block { padding: 1rem 0 1.15rem; }

      .stat-block:nth-child(-n + 2) { padding-top: 0.25rem; }

      .stat-number { font-size: clamp(2.8rem, 11vw, 4rem); }

      .stats-footer { margin-top: 1rem; }

      .course-scroll { height: min(68dvh, 56rem); }
    }

    @media (max-width: 620px) {
      .course-controls { grid-template-columns: 6.5rem minmax(0, 1fr); }

      .letter-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }

      .course-scroll-inner { padding: 0.85rem; }

      .course { padding: 1rem; }
    }

    @media (max-width: 460px) {
      .workspace { margin-top: 1rem; }

      .stats-panel { padding: 1.15rem; }

      .stat-number { font-size: 2.65rem; }

      .course-controls { grid-template-columns: 1fr; }

      .course-grade-control { grid-column: auto; }

      .letter-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .save-btn { padding-inline: 0.85rem; }
    }

    ::selection {
      background: #f3f3f3;
      color: #0b0b0b;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const LETTERS = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "F"];

    const LETTER_POINTS = {
      "A+": 4.0, "A": 4.0, "A-": 3.7,
      "B+": 3.3, "B": 3.0, "B-": 2.7,
      "C+": 2.3, "C": 2.0, "C-": 1.7,
      "D+": 1.3, "D": 1.0, "D-": 0.7,
      "F": 0.0
    };

    const TYPES = [
      { id: "onlevel", label: "On Level" },
      { id: "honors", label: "Honors" },
      { id: "ap", label: "AP / IB" }
    ];

    function percentToLetter(score) {
      const n = Number(score);
      if (Number.isNaN(n)) return null;
      if (n >= 97) return "A+";
      if (n >= 93) return "A";
      if (n >= 90) return "A-";
      if (n >= 87) return "B+";
      if (n >= 83) return "B";
      if (n >= 80) return "B-";
      if (n >= 77) return "C+";
      if (n >= 73) return "C";
      if (n >= 70) return "C-";
      if (n >= 67) return "D+";
      if (n >= 63) return "D";
      if (n >= 60) return "D-";
      return "F";
    }

    function letterFromCourse(course) {
      if (course.mode === "score") return percentToLetter(course.score);
      return course.letter;
    }

    function pointsFor(course) {
      const letter = letterFromCourse(course);
      if (!letter) return null;
      let pts = LETTER_POINTS[letter];
      if (course.type === "ap" && pts > 0) pts += 1;
      return pts;
    }

    function uid() {
      return Math.random().toString(36).slice(2, 9);
    }

    function createCourse() {
      return {
        id: uid(),
        name: "",
        credits: 1,
        type: "onlevel",
        mode: "letter",
        letter: "A",
        score: ""
      };
    }

    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (value == null || value === false) continue;
        if (key === "class") node.className = value;
        else if (key === "dataset") Object.assign(node.dataset, value);
        else if (key.startsWith("on") && typeof value === "function") {
          node.addEventListener(key.slice(2).toLowerCase(), value);
        } else if (key === "style" && typeof value === "object") {
          Object.assign(node.style, value);
        } else if (value === true) node.setAttribute(key, "");
        else node.setAttribute(key, value);
      }
      for (const child of [].concat(children)) {
        if (child == null || child === false) continue;
        node.append(child.nodeType ? child : document.createTextNode(child));
      }
      return node;
    }

    const STORAGE_KEY = "gpa.courses.v1";

    class Store {
      constructor() {
        const restored = Store.load();
        this.courses = restored && Array.isArray(restored.courses) && restored.courses.length
          ? restored.courses
          : [createCourse(), createCourse(), createCourse()];
        this.restoredAt = restored ? restored.savedAt : null;
        this.subs = [];
      }

      static load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.courses)) return null;
          return {
            savedAt: parsed.savedAt || null,
            courses: parsed.courses.map((c) => ({
              ...createCourse(),
              ...c,
              id: c.id || uid()
            }))
          };
        } catch (err) {
          return null;
        }
      }

      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            v: 1,
            savedAt: Date.now(),
            courses: this.courses
          }));
          return true;
        } catch (err) {
          return false;
        }
      }

      subscribe(fn) {
        this.subs.push(fn);
        return () => {
          this.subs = this.subs.filter((s) => s !== fn);
        };
      }

      emit() {
        this.subs.forEach((fn) => fn(this.courses));
      }

      add() {
        this.courses = [...this.courses, createCourse()];
        this.emit();
      }

      remove(id) {
        this.courses = this.courses.filter((c) => c.id !== id);
        this.emit();
      }

      update(id, patch) {
        this.courses = this.courses.map((c) => (c.id === id ? { ...c, ...patch } : c));
        this.emit();
      }

      reset() {
        this.courses = [createCourse(), createCourse(), createCourse()];
        this.emit();
      }

      get(id) {
        return this.courses.find((c) => c.id === id);
      }
    }

    class GPA {
      static compute(courses) {
        let wPoints = 0;
        let uPoints = 0;
        let credits = 0;
        let counted = 0;

        for (const course of courses) {
          const cr = Number(course.credits);
          const pts = pointsFor(course);
          if (!cr || cr <= 0 || pts == null) continue;
          const letter = letterFromCourse(course);
          const unweighted = LETTER_POINTS[letter];
          wPoints += pts * cr;
          uPoints += unweighted * cr;
          credits += cr;
          counted += 1;
        }

        return {
          weighted: credits ? wPoints / credits : null,
          unweighted: credits ? uPoints / credits : null,
          credits,
          counted
        };
      }

      static fmt(n) {
        return n == null ? "—" : n.toFixed(2);
      }
    }

    class Component {
      constructor(props = {}) {
        this.props = props;
        this.root = null;
      }

      mount(parent) {
        this.root = this.render();
        parent.append(this.root);
        return this.root;
      }

      render() {
        throw new Error("render() not implemented");
      }
    }

    class GpaHero extends Component {
      constructor(store) {
        super();
        this.store = store;
        this.store.subscribe(() => this.refresh());
      }

      render() {
        this.valueEl = el("div", { class: "stat-number" }, "—");
        this.unweightedEl = el("div", { class: "stat-number" }, "—");
        this.coursesEl = el("div", { class: "stat-number stat-number--small" }, "0");
        this.creditsEl = el("div", { class: "stat-number stat-number--small" }, "0");

        const stat = (label, node) =>
          el("div", { class: "stat-block" }, [
            el("div", { class: "label" }, label),
            node
          ]);

        this.root = el("aside", { class: "stats-panel squircle", "aria-label": "GPA summary" }, [
          el("div", { class: "stats-list" }, [
            stat("Weighted GPA", this.valueEl),
            stat("Unweighted GPA", this.unweightedEl),
            stat("Courses", this.coursesEl),
            stat("Credits", this.creditsEl)
          ]),
          el("div", { class: "stats-footer" }, [
            el("div", { class: "scale-note" }, [
              el("div", {}, "On Level · Honors — 4.0"),
              el("div", {}, "AP · IB — 5.0")
            ]),
            el("button", {
              type: "button",
              class: "ghost squircle-sm px-3 py-2",
              onClick: () => this.store.reset()
            }, "Reset")
          ])
        ]);

        this.refresh();
        return this.root;
      }

      refresh() {
        if (!this.valueEl) return;
        const { weighted, unweighted, credits, counted } = GPA.compute(this.store.courses);
        this.valueEl.textContent = GPA.fmt(weighted);
        this.unweightedEl.textContent = GPA.fmt(unweighted);
        this.coursesEl.textContent = String(counted);
        this.creditsEl.textContent = credits ? String(Number(credits.toFixed(2))) : "0";
      }
    }

    class CourseItem extends Component {
      constructor(course, store) {
        super();
        this.course = course;
        this.store = store;
      }

      patch(partial) {
        this.store.update(this.course.id, partial);
        this.course = this.store.get(this.course.id);
        this.sync();
      }

      render() {
        this.nameInput = el("input", {
          class: "field squircle-sm",
          type: "text",
          placeholder: "Course name",
          maxlength: "48",
          value: this.course.name,
          "aria-label": "Course name",
          onInput: (e) => this.patch({ name: e.target.value })
        });

        this.creditInput = el("input", {
          class: "field squircle-sm w-full text-center",
          type: "number",
          min: "0",
          max: "10",
          step: "0.5",
          value: this.course.credits,
          "aria-label": "Credits",
          onInput: (e) => this.patch({ credits: e.target.value === "" ? "" : Number(e.target.value) })
        });

        this.typeBtns = TYPES.map((t) =>
          el("button", {
            type: "button",
            class: "seg squircle-xs flex-1 py-2 text-[0.78rem] font-medium",
            dataset: { type: t.id },
            onClick: () => this.patch({ type: t.id })
          }, t.label)
        );

        this.modeLetterBtn = el("button", {
          type: "button",
          class: "seg squircle-xs flex-1 py-2 text-[0.78rem] font-medium",
          onClick: () => this.patch({ mode: "letter" })
        }, "Letter");

        this.modeScoreBtn = el("button", {
          type: "button",
          class: "seg squircle-xs flex-1 py-2 text-[0.78rem] font-medium",
          onClick: () => this.patch({ mode: "score" })
        }, "Score / 100");

        this.letterBtns = LETTERS.map((letter) =>
          el("button", {
            type: "button",
            class: "letter squircle-xs",
            dataset: { letter },
            onClick: () => this.patch({ letter, mode: "letter" })
          }, letter)
        );

        this.scoreInput = el("input", {
          class: "field squircle-sm text-center text-lg font-light tracking-tight",
          type: "number",
          min: "0",
          max: "100",
          step: "0.1",
          placeholder: "0–100",
          value: this.course.score,
          "aria-label": "Score out of 100",
          onInput: (e) => this.patch({ score: e.target.value, mode: "score" })
        });

        this.letterHint = el("span", { class: "text-[#8a8a8a] text-sm" }, "");
        this.pointsEl = el("span", { class: "stat-val text-sm text-[#8a8a8a]" }, "");

        this.letterWrap = el("div", { class: "letter-grid" }, this.letterBtns);
        this.scoreWrap = el("div", { class: "score-row" }, [
          this.scoreInput,
          el("div", { class: "shrink-0" }, [
            el("div", { class: "label" }, "letter"),
            this.letterHint
          ])
        ]);

        this.root = el("article", { class: "course squircle" }, [
          el("div", { class: "flex gap-2 items-center" }, [
            this.nameInput,
            el("button", {
              type: "button",
              class: "icon-btn squircle-sm",
              "aria-label": "Remove course",
              onClick: () => this.store.remove(this.course.id)
            }, "×")
          ]),
          el("div", { class: "course-controls" }, [
            el("div", { class: "control-group" }, [
              el("div", { class: "label mb-1.5" }, "Credits"),
              this.creditInput
            ]),
            el("div", { class: "control-group" }, [
              el("div", { class: "label mb-1.5" }, "Type"),
              el("div", { class: "flex gap-1.5" }, this.typeBtns)
            ]),
            el("div", { class: "control-group course-grade-control" }, [
              el("div", { class: "grade-heading" }, [
                el("div", { class: "label" }, "Grade"),
                this.pointsEl
              ]),
              el("div", { class: "mode-switch" }, [
                this.modeLetterBtn,
                this.modeScoreBtn
              ])
            ])
          ]),
          el("div", { class: "grade-input" }, [
            this.letterWrap,
            this.scoreWrap
          ])
        ]);

        this.sync();
        return this.root;
      }

      sync() {
        const c = this.course;
        this.typeBtns.forEach((btn) => btn.classList.toggle("is-on", btn.dataset.type === c.type));
        this.modeLetterBtn.classList.toggle("is-on", c.mode === "letter");
        this.modeScoreBtn.classList.toggle("is-on", c.mode === "score");
        this.letterBtns.forEach((btn) => btn.classList.toggle("is-on", c.mode === "letter" && btn.dataset.letter === c.letter));
        this.letterWrap.hidden = c.mode !== "letter";
        this.scoreWrap.hidden = c.mode !== "score";

        const letter = letterFromCourse(c);
        const pts = pointsFor(c);
        this.letterHint.textContent = letter || "—";
        if (pts == null) this.pointsEl.textContent = "";
        else {
          const scale = c.type === "ap" ? "5.0" : "4.0";
          this.pointsEl.textContent = `${pts.toFixed(2)} · ${scale} scale`;
        }
      }
    }

    class CourseList extends Component {
      constructor(store) {
        super();
        this.store = store;
        this.items = new Map();
        this.hasMounted = false;
        this.store.subscribe(() => this.sync());
      }

      render() {
        this.listEl = el("div", { class: "flex flex-col gap-3" });
        this.emptyEl = el("p", { class: "text-center text-[#8a8a8a] text-sm py-6" }, "No courses yet.");
        this.root = el("section", { class: "course-list", "aria-label": "Courses" }, [this.listEl, this.emptyEl]);
        this.sync();
        this.hasMounted = true;
        return this.root;
      }

      sync() {
        if (!this.listEl) return;
        const ids = new Set(this.store.courses.map((c) => c.id));

        for (const [id, item] of this.items) {
          if (!ids.has(id)) {
            item.root.remove();
            this.items.delete(id);
          }
        }

        let addedItem = null;

        for (const course of this.store.courses) {
          if (!this.items.has(course.id)) {
            const item = new CourseItem(course, this.store);
            item.mount(this.listEl);
            this.items.set(course.id, item);
            addedItem = item;
          }
        }

        this.emptyEl.hidden = this.store.courses.length > 0;

        if (addedItem && this.hasMounted) {
          requestAnimationFrame(() => {
            const scroller = this.root.closest(".course-scroll");
            if (scroller) scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" });
          });
        }
      }
    }

    class SaveBar extends Component {
      constructor(store) {
        super();
        this.store = store;
        this.dirty = false;
        this.store.subscribe(() => {
          this.dirty = true;
          this.renderStatus();
        });
        this.onOnline = () => this.renderStatus();
        this.onOffline = () => this.renderStatus();
        this.onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
            e.preventDefault();
            this.save();
          }
        };
      }

      save() {
        const ok = this.store.save();
        if (!ok) {
          this.dirty = true;
          this.renderStatus("Storage unavailable");
          return;
        }
        this.dirty = false;
        const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        this.renderStatus("Saved · " + time);
        this.saveBtn.classList.add("is-saved");
        clearTimeout(this._flash);
        this._flash = setTimeout(() => this.saveBtn.classList.remove("is-saved"), 1100);
      }

      renderStatus(forced) {
        if (!this.statusEl) return;
        if (typeof navigator !== "undefined" && navigator.onLine === false) {
          this.statusEl.textContent = "Offline · saved locally";
          this.dot.classList.add("is-live");
          return;
        }
        this.dot.classList.remove("is-live");
        if (forced) {
          this.statusEl.textContent = forced;
        } else if (this.dirty) {
          this.statusEl.textContent = "Unsaved changes";
        } else if (this.store.restoredAt) {
          const d = new Date(this.store.restoredAt);
          this.statusEl.textContent = "Restored · " + d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        } else {
          this.statusEl.textContent = "Nothing saved yet";
        }
      }

      render() {
        this.statusEl = el("span", { class: "text-[0.74rem] tracking-[0.06em] text-[#8a8a8a]" }, "");
        this.dot = el("span", { class: "status-dot" });
        this.saveBtn = el("button", {
          type: "button",
          class: "save-btn squircle-sm",
          onClick: () => this.save()
        }, "Save classes");

        this.root = el("div", { class: "app-header flex items-center justify-between gap-4 pt-7" }, [
          el("div", { class: "min-w-0" }, [
            el("div", { class: "label mb-1" }, "GPA Calculator"),
            el("div", { class: "flex items-center gap-2 min-w-0" }, [
              this.dot,
              el("span", { class: "truncate" }, this.statusEl)
            ])
          ]),
          this.saveBtn
        ]);

        this.renderStatus();
        window.addEventListener("online", this.onOnline);
        window.addEventListener("offline", this.onOffline);
        document.addEventListener("keydown", this.onKey);
        return this.root;
      }
    }

    class App extends Component {
      constructor(store) {
        super();
        this.store = store;
      }

      render() {
        const saveBar = new SaveBar(this.store);
        const stats = new GpaHero(this.store);
        const list = new CourseList(this.store);

        const add = el("button", {
          type: "button",
          class: "add-btn squircle",
          onClick: () => this.store.add()
        }, "+  Add course");

        const coursePanel = el("section", {
          class: "course-scroll squircle",
          tabindex: "0",
          "aria-label": "Course details"
        }, [
          el("div", { class: "course-scroll-inner" }, [
            list.render(),
            add
          ])
        ]);

        this.root = el("main", { class: "app-shell" }, [
          saveBar.render(),
          el("div", { class: "workspace" }, [
            stats.render(),
            coursePanel
          ])
        ]);

        return this.root;
      }
    }

    const store = new Store();
    const app = new App(store);
    app.mount(document.getElementById("app"));

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
